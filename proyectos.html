<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos | RACM Inteligencia Artificial & Ciencia de Datos</title>
    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #3498db; --bg-color: #f8f9fa; --text-color: #333333; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { background-image: linear-gradient(rgba(26, 37, 47, 0.85), rgba(26, 37, 47, 0.85)), url('img/banner-tecnico.jpg'); background-size: cover; background-position: center; color: white; text-align: center; padding: 4rem 1rem; border-bottom: 4px solid var(--secondary-color); }
        .foto-perfil { width: 150px; height: 150px; border-radius: 50%; border: 3px solid white; object-fit: cover; margin-bottom: 1rem; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        nav { background-color: var(--primary-color); padding: 1rem; text-align: center; }
        nav a { color: white; margin: 0 1rem; text-decoration: none; font-weight: bold; transition: color 0.3s; }
        nav a:hover { color: var(--secondary-color); }
        main { max-width: 800px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        h2 { color: var(--primary-color); margin-bottom: 1rem; border-bottom: 2px solid var(--secondary-color); padding-bottom: 0.5rem; }
        .proyecto { background-color: var(--bg-color); padding: 1.5rem; border-radius: 6px; margin-bottom: 1.5rem; border-left: 4px solid var(--secondary-color); }
        .proyecto h3 { color: var(--primary-color); margin-bottom: 0.5rem; }
        .tecnologias { font-size: 0.85rem; font-weight: bold; color: var(--secondary-color); display: block; margin-top: 0.5rem; }
        footer { text-align: center; padding: 1.5rem; margin-top: 3rem; color: #666; }
    </style>
</head>
<body>
<header>
    <img src="img/perfil.jpg" alt="Foto de Roberto Alejandro" class="foto-perfil">
    <h1>RACM Inteligencia Artificial & Ciencia de Datos</h1>
    <p>Roberto Alejandro Chagra Martinez
        Lic. en Inteligencia Artificial y Ciencia de Datos</p>
</header>
<nav>
    <a href="index.html">Inicio</a>
    <a href="proyectos.html">Proyectos</a>
    <a href="contacto.html">Contacto</a>
</nav>
<main>
    <h2>Mis Proyectos</h2>
    <div id="repositorios" class="repo-grid">
        <p>Cargando proyectos...</p>
    </div>
</main>

<script>
    const githubUsername = '\n' + 'RACM-IA-DataScience';
    const apiUrl = `https://api.github.com/users/${githubUsername}/repos?sort=updated`;

    async function fetchRepos() {
        const container = document.getElementById('repositorios');

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Error al obtener los datos');

            const repos = await response.json();

            // Limpiar el mensaje de "Cargando..."
            container.innerHTML = '';

            // Filtrar repositorios (opcional: quitar forks) y mostrar los primeros 6
            const reposAMostrar = repos.filter(repo => !repo.fork).slice(0, 6);

            reposAMostrar.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'repo-card';

                card.innerHTML = `
                        <a href="${repo.html_url}" class="repo-name" target="_blank">${repo.name}</a>
                        <p class="repo-desc">${repo.description || 'Sin descripción disponible.'}</p>
                        <span class="repo-lang">💻 ${repo.language || 'Múltiples lenguajes'}</span>
                    `;

                container.appendChild(card);
            });

        } catch (error) {
            container.innerHTML = '<p>Hubo un error al cargar los repositorios. Por favor, visita mi perfil directamente.</p>';
            console.error(error);
        }
    }

    // Ejecutar la función al cargar la página
    fetchRepos();
</script>
</main>
<footer>
    <p>&copy; 2026 RACM Inteligencia Artificial & Ciencia de Datos. Construido y alojado con GitHub Pages.</p>
</footer>
</body>
</html>
