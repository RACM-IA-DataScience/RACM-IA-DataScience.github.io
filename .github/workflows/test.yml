name: Prueba de mi Acción de GitHub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  probar-accion:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el código del repositorio en la máquina virtual de GitHub
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Paso 2: Crear un archivo index.html falso para simular tu sitio web
      # (Puedes comentar este paso para ver cómo tu acción falla correctamente si no existe)
      - name: Simular generación de sitio web
        run: |
          echo "<h1>Mi sitio web para GitHub Pages</h1>" > index.html

      # Paso 3: Ejecutar TU acción personalizada utilizando la sintaxis './'
      # (Le indicamos a GitHub que la acción está en la raíz de este mismo repositorio)
      - name: Ejecutar mi Validador de Pages
        id: validador
        uses: ./
        with:
          build-folder: '.' # Carpeta donde creamos el index.html en el paso anterior

      # Paso 4: Comprobar si tu acción devolvió correctamente la marca de tiempo (output)
      - name: Mostrar resultado de la acción
        run: |
          echo "La acción validó el archivo correctamente a las: ${{ steps.validador.outputs.validated-at }}"
