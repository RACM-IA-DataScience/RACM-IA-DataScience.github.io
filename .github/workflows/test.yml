name: Prueba de mi Acción de GitHub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  probar-accion:
    # Cambiado a la versión fija 24.04 para silenciar la advertencia de migración global
    runs-on: ubuntu-24.04

    steps:
      # Paso 1: Actualizado a v4.2.2 para evitar el mensaje de obsolescencia de Node 20
      - name: Descargar repositorio
        uses: actions/checkout@v4.2.2

      - name: Simular generación de sitio web
        run: |
          echo "<h1>Mi sitio web para GitHub Pages</h1>" > index.html

      - name: Ejecutar mi Validador de Pages
        id: validador
        uses: ./
        with:
          build-folder: '.'

      - name: Mostrar resultado de la acción
        run: |
          echo "La acción validó el archivo correctamente a las: ${{ steps.validador.outputs.validated-at }}"
