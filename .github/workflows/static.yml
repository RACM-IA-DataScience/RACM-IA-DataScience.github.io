name: Deploy static content to Pages

on:
  # Se ejecuta cada vez que envías código a la rama main
  push:
    branches: ["main"]
  # Permite ejecutar este flujo de trabajo manualmente desde la pestaña Actions
  workflow_dispatch:

# Otorga los permisos necesarios para publicar el sitio
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente, saltando las ejecuciones en cola
concurrency:
  group: "pages"
  cancel-in-progress: false

# Forzar el motor de ejecución nativo a Node.js 24 sin advertencias de obsolescencia
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Trabajo de despliegue único con Node 24
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        # Restrinjo la subida a un solo trabajo de la matriz para evitar artefactos duplicados.
        if: matrix.os == 'ubuntu-latest'
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
