name: 'Mi Acción con Setup'
description: 'Valida archivos y corre un script de configuración previo'

inputs:
  build-folder:
    description: 'Carpeta de compilación'
    default: '.'

runs:
  using: 'node24'
  pre: 'dist/setup/index.js'       # El archivo YAML del que hablábamos es este
  pre-name: 'Inicializando Setup'  # Nombre que saldrá en la interfaz de GitHub
  main: 'dist/index.js'            # Tu código principal